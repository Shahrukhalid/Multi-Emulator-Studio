name: Desktop checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_macos:
        description: 'Build and verify a Developer ID signed/notarized macOS candidate'
        type: boolean
        default: false
      signed_windows:
        description: 'Build and verify an Authenticode-signed Windows candidate'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: dmg
            candidate: macos-arm64-development
            artifact: development-adhoc-macOS-ARM64
          - os: windows-2022
            bundle: nsis
            candidate: windows-x64-development
            artifact: development-unsigned-Windows-X64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/Cargo.lock') }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test verify-packages.test.mjs
      - run: node --test frame-scheduler.test.mjs
      - run: node --test managed-setup-flow.test.mjs
      - run: node --test candidate-manifest.test.mjs release-readiness.test.mjs
      - run: node --test video-annexb.test.mjs
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable test --locked --manifest-path ../Cargo.toml
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo install tauri-cli --version 2.12.4 --locked
      # Never validate stale bundles restored from the build cache.
      - run: node -e "require('node:fs').rmSync('target/release/bundle', {recursive:true, force:true})"
      - if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: cargo tauri build --bundles dmg --ci -- --locked
      - if: runner.os == 'macOS'
        run: bash verify-development-macos.sh target/release/bundle
      - if: runner.os == 'Windows'
        run: cargo tauri build --bundles nsis --no-sign --ci -- --locked
      - run: node verify-packages.mjs target/release/bundle ${{ matrix.bundle }}
      - run: node candidate-manifest.mjs target/release/bundle ${{ matrix.candidate }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/target/release/bundle/**/*.dmg
            desktop/target/release/bundle/**/*.exe
            desktop/target/release/bundle/SHA256SUMS.txt
            desktop/target/release/bundle/CANDIDATE.json
          if-no-files-found: error
          retention-days: 7

  signed-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_macos && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/milestone/m3-6-release-candidate')
    needs: desktop
    runs-on: macos-15
    environment: macos-signing
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup toolchain install stable --profile minimal
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Sign, notarize and verify the DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash sign-macos.sh
      - run: node candidate-manifest.mjs target/release/bundle macos-arm64-signed
      - uses: actions/upload-artifact@v4
        with:
          name: verified-signed-macOS-ARM64
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/SHA256SUMS.txt
            desktop/target/release/bundle/CANDIDATE.json
          if-no-files-found: error
          retention-days: 14

  signed-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_windows && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/milestone/m3-6-release-candidate')
    needs: desktop
    runs-on: windows-2022
    environment: windows-signing
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup toolchain install stable --profile minimal
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Sign and verify Windows candidate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_THUMBPRINT }}
        run: ./sign-windows.ps1
      - run: node candidate-manifest.mjs target/release/bundle windows-x64-signed
      - uses: actions/upload-artifact@v4
        with:
          name: verified-signed-Windows-X64
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/SHA256SUMS.txt
            desktop/target/release/bundle/CANDIDATE.json
          if-no-files-found: error
          retention-days: 14

  publish-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: development-adhoc-macOS-ARM64
          path: candidates/macos
      - uses: actions/download-artifact@v4
        with:
          name: development-unsigned-Windows-X64
          path: candidates/windows
      - name: Verify exact source and development artifacts
        shell: bash
        run: |
          set -euo pipefail
          for platform in macos windows; do
            (cd "candidates/$platform" && sha256sum -c SHA256SUMS.txt)
          done
          node --input-type=module <<'NODE'
          import { readFileSync, statSync, createReadStream } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { resolve, relative, isAbsolute } from 'node:path';
          const targets = [
            ['macos', 'macos-arm64', 'ad-hoc', '.dmg'],
            ['windows', 'windows-x64', 'unsigned', '.exe']
          ];
          let version;
          for (const [dir, platform, signing, ext] of targets) {
            const root = resolve('candidates', dir);
            const manifest = JSON.parse(readFileSync(resolve(root, 'CANDIDATE.json'), 'utf8'));
            if (manifest.schema !== 1 || manifest.product !== 'Multi-Emulator Studio' ||
                manifest.commit !== process.env.GITHUB_SHA || manifest.platform !== platform ||
                manifest.signing !== signing || manifest.distribution !== 'development' ||
                !/^\d+\.\d+\.\d+$/.test(manifest.version) || (version && version !== manifest.version) ||
                !Array.isArray(manifest.artifacts) || !manifest.artifacts.length) {
              throw new Error('Invalid development manifest: ' + dir);
            }
            version = manifest.version;
            for (const item of manifest.artifacts) {
              const path = resolve(root, item.path);
              const rel = relative(root, path);
              if (!rel || rel.startsWith('..') || isAbsolute(rel) || !path.endsWith(ext) ||
                  !statSync(path).isFile() || statSync(path).size !== item.bytes || item.bytes <= 0) {
                throw new Error('Invalid installer path or size');
              }
              const hash = createHash('sha256');
              for await (const chunk of createReadStream(path)) hash.update(chunk);
              if (hash.digest('hex') !== item.sha256) throw new Error('Installer hash mismatch');
            }
          }
          NODE
          (cd candidates/macos && zip -qr ../../Multi-Emulator-Studio-macOS-ARM64-development.zip .)
          (cd candidates/windows && zip -qr ../../Multi-Emulator-Studio-Windows-X64-development.zip .)
          sha256sum Multi-Emulator-Studio-*-development.zip > SHA256SUMS.txt
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./candidates/macos/CANDIDATE.json').version")
          tag="v${version}-dev.${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Development prerelease already exists: $tag"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Multi-Emulator Studio $version — development preview" \
            --notes "Automated development preview for commit $GITHUB_SHA. CI and package integrity passed. macOS is ad-hoc signed; Windows is unsigned. Native two-device acceptance, clean setup, and production signing are not verified. Not a stable production release." \
            Multi-Emulator-Studio-macOS-ARM64-development.zip \
            Multi-Emulator-Studio-Windows-X64-development.zip SHA256SUMS.txt
