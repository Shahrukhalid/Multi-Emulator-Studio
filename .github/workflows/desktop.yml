name: Desktop checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      signed_macos:
        description: 'Build and verify a Developer ID signed/notarized macOS candidate'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: dmg
            candidate: macos-arm64-development
            artifact: development-adhoc-macOS-ARM64
          - os: windows-2022
            bundle: nsis
            candidate: windows-x64-development
            artifact: development-unsigned-Windows-X64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/Cargo.lock') }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test verify-packages.test.mjs
      - run: node --test frame-scheduler.test.mjs
      - run: node --test managed-setup-flow.test.mjs
      - run: node --test candidate-manifest.test.mjs release-readiness.test.mjs
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo install tauri-cli --version 2.12.4 --locked
      # Never validate stale bundles restored from the build cache.
      - run: node -e "require('node:fs').rmSync('target/release/bundle', {recursive:true, force:true})"
      - if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: cargo tauri build --bundles dmg --ci -- --locked
      - if: runner.os == 'macOS'
        run: bash verify-development-macos.sh target/release/bundle
      - if: runner.os == 'Windows'
        run: cargo tauri build --bundles nsis --no-sign --ci -- --locked
      - run: node verify-packages.mjs target/release/bundle ${{ matrix.bundle }}
      - run: node candidate-manifest.mjs target/release/bundle ${{ matrix.candidate }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/target/release/bundle/**/*.dmg
            desktop/target/release/bundle/**/*.exe
            desktop/target/release/bundle/SHA256SUMS.txt
            desktop/target/release/bundle/CANDIDATE.json
          if-no-files-found: error
          retention-days: 7

  signed-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_macos && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/milestone/m3-6-release-candidate')
    needs: desktop
    runs-on: macos-15
    environment: macos-signing
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup toolchain install stable --profile minimal
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Sign, notarize and verify the DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash sign-macos.sh
      - run: node candidate-manifest.mjs target/release/bundle macos-arm64-signed
      - uses: actions/upload-artifact@v4
        with:
          name: verified-signed-macOS-ARM64
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/SHA256SUMS.txt
            desktop/target/release/bundle/CANDIDATE.json
          if-no-files-found: error
          retention-days: 14
